name: Compile AHK Script

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to trigger the run manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Ahk2Exe (64bit)
      uses: tamo/action-Ahk2Exe@main
      with:
        base: AutoHotkey64.exe
        src: RestoreWinPos.ahk

    - run: ls RestoreWinPos.exe
