name: Compile AHK Script

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to trigger the run manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Ahk2Exe (64bit)
      uses: tamo/action-Ahk2Exe@main
      with:
        version: v1.3.36.02       # Forces the action to download the AHK v1 compiler
        base: Unicode 64-bit.bin  # The correct 64-bit base file name for AHK v1
        src: JumpToFolder.ahk

    - run: ls JumpToFolder.exe
